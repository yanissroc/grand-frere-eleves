<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>C-Bot : Ton Compagnon</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f0f2f5; }
        h1 { color: #2c3e50; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .btn { 
            padding: 20px 40px; font-size: 20px; cursor: pointer; border: none; border-radius: 10px;
            color: white; text-decoration: none; transition: 0.3s;
        }
        .btn-mentor { background-color: #4CAF50; } /* Vert */
        .btn-jeu { background-color: #2196F3; }    /* Bleu */
        .btn:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>Bonjour ! Que veux-tu faire ?</h1>
    <div class="container">
        <a href="LIEN_MIZOU_MENTOR" class="btn btn-mentor">💬 Parler au Grand Frère</a>
        
        <a href="LIEN_MIZOU_JEU" class="btn btn-jeu">🎮 Jouer à School's Secret</a>
    </div>
</body>
</html>
